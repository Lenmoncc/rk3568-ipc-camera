# IPC 初版配置。只支持整行 # 注释；不使用引号、行内注释或环境变量替换。
# 当前只读取和校验参数，不打开摄像头、声卡，不连接服务器或写录像。
video.device=/dev/video0
video.width=1280
video.height=720
video.pixel_format=NV12
video.codec=h264
video.fps=30
# 码率与 GOP 是初始建议；fps 是目标值，不代表实测结果。
video.bitrate=2000000
video.gop=30

audio.device=hw:0,0
audio.sample_format=S16_LE
audio.codec=aac
# 下列音频值为开发初值，尚未从现有记录确认，不作为实测结论。
# 接入音频采集前，将它们替换为实际已经验证的值。
audio.sample_rate=48000
audio.channels=1
audio.bitrate=128000

# 当前 SRS 地址占位：禁用推流时允许保留占位地址或空字符串。
# 后续启用时同时改为 true 和真实 rtmp://主机[:端口]/应用/流名。
output.rtmp_enabled=false
output.rtmp_url=rtmp://SRS_SERVER_IP/live/stream
output.record_path=/userdata/record/ipc.mp4
# 本阶段不创建目录/文件，也不决定后续录像命名及覆盖策略。

# 容量单位为队列元素数；两路输出各自使用对应的编码包队列容量。
queue.video_raw_capacity=4
queue.audio_raw_capacity=16
queue.video_packet_capacity=32
queue.audio_packet_capacity=64

# 可选值 debug / info / warn / error；省略此键时默认 info。
log.level=info
