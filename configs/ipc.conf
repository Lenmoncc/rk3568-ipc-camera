# 配置格式草案；当前骨架尚未读取本文件。
# 初版确定项：720P NV12、MPP H.264、SDK FFmpeg 4.4.1。
video.device=/dev/video0
video.width=1280
video.height=720
video.pixel_format=NV12
video.codec=h264
video.fps=30
# 以下码率/GOP 是起始建议，不是实测结论。
video.bitrate=2000000
video.gop=30

audio.device=hw:0,0
audio.sample_format=S16_LE
audio.codec=aac
# 0 表示待填写已验证参数，后续校验器必须拒绝它，不能按 0 启动硬件。
audio.sample_rate=0
audio.channels=0
audio.bitrate=128000

# 待填写实际 Ubuntu/SRS 地址，后续校验器须拒绝空地址。
output.rtmp_url=
output.record_path=/userdata/record/ipc.mp4
# 后续录像实现需确定文件命名/覆盖策略，当前不会创建或覆盖此文件。

# 每路输出分别拥有以下容量；按元素计数，后续结合实际积压调整。
queue.video_raw_capacity=4
queue.audio_raw_capacity=16
queue.video_packet_capacity=32
queue.audio_packet_capacity=64
