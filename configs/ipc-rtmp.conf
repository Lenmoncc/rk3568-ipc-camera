# IPC 初版配置。只支持整行 # 注释；不使用引号、行内注释或环境变量替换。
# 默认只检查配置；--capture/--encode 打开摄像头，--audio-capture 独立录制 PCM，--audio-encode 独立编码 AAC。
video.device=/dev/video0
video.width=1280
video.height=720
video.pixel_format=NV12
video.codec=h264
video.fps=30
# fps 是采集目标；编码默认复用该值，板端实测 25fps 时请传 --encode-fps 25。
# bitrate/GOP 用于 MPP 码控与关键帧间隔；GOP 单位为编码帧数。
video.bitrate=2000000
video.gop=30

audio.device=hw:0,0
audio.sample_format=S16_LE
audio.codec=aac
# 板端枚举 hw:0,0 为 RK809；支持 S16_LE，声道范围 2..8，单声道设置失败。
# 本阶段使用 48kHz 双声道；具体组合由程序严格设置/读回，并通过板端录音确认。
audio.sample_rate=48000
audio.channels=2
# --audio-encode 使用 AAC-LC，目标码率单位 bit/s；PCM 模式不使用该码率。
audio.bitrate=128000

# 已验证网络链路的 SRS 服务器；流名沿用部署文档的 live/cam01。
# --record 同时推流与录像；--stream 只推流；独立调试模式不连接网络。
output.rtmp_enabled=true
output.rtmp_url=rtmp://192.168.137.100:1935/live/cam01
output.record_path=/userdata/record/ipc.mp4
# --record 默认使用此路径，--mp4 可覆盖；父目录须存在，拒绝覆盖已有文件。

# 容量单位为队列元素数；两路输出各自使用对应的编码包队列容量。
queue.video_raw_capacity=4
queue.audio_raw_capacity=16
queue.video_packet_capacity=32
queue.audio_packet_capacity=64

# 可选值 debug / info / warn / error；省略此键时默认 info。
log.level=info
